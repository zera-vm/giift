<div class="kado-stage">

  <div class="kado-scene active" id="giftScene">

    <div class="greeting">
      <h1 class="greeting-main" aria-label="Merry Christmas"><span aria-hidden="true"><span class="lampu-run">Merry</span> <span class="lampu-run">Christmas</span></span></h1>
    </div>

    <div class="kado-box-viewport" id="boxViewport">

      <div class="kado-box3d" id="box3d">

        <div class="kado-face kf-inside"></div>

        <div class="kado-face kf-bottom">
          <div class="ribbon-v"></div>
          <div class="ribbon-h"></div>
        </div>

        <div class="kado-face kf-left">
          <div class="ribbon-v"></div>
        </div>

        <div class="kado-face kf-right">
          <div class="ribbon-v"></div>
        </div>

        <div class="kado-face kf-back">
          <div class="ribbon-v"></div>
        </div>

        <div class="kado-face kf-front">
          <div class="ribbon-v"></div>
        </div>

        <div class="kado-lid-group">

          <div class="kado-face lid-left">
            <div class="ribbon-v"></div>
          </div>

          <div class="kado-face lid-right">
            <div class="ribbon-v"></div>
          </div>

          <div class="kado-face lid-back">
            <div class="ribbon-v"></div>
          </div>

          <div class="kado-face lid-front">
            <div class="ribbon-v"></div>
          </div>

          <div class="kado-face lid-top">
            <div class="ribbon-v"></div>
            <div class="ribbon-h"></div>
          </div>

        </div>

      </div>
    </div>
  </div>

  <div class="kado-scene" id="cardScene">

    <div class="kado-card-viewport" id="cardViewport">

      <div class="kado-card3d" id="card3d">

        <div class="cf cf-front">

          <img
            id="giftImage"
            src="gift.jpg"
            alt="Kartu hadiah">

        </div>

        <div class="cf cf-back">

          <p class="to">
            Vincentia Sissy,
          </p>

          <p class="message">
            Selamat Natal,
            semoga momen bahagia ini memberikanmu
            kenangan terindah di dalam hidupmu
          </p>

          <p class="from">
            — Indra M
          </p>

        </div>

        <div class="cf-edge cf-top"></div>
        <div class="cf-edge cf-bottom"></div>
        <div class="cf-edge cf-left"></div>
        <div class="cf-edge cf-right"></div>

      </div>
    </div>
  </div>

</div>

<div class="surat-overlay" id="suratOverlay" hidden>

  <div class="kertas" role="dialog" aria-modal="true" aria-labelledby="suratJudul">

    <button class="kertas-tutup" id="suratTutup" type="button"
            aria-label="Tutup kertas">&times;</button>

    <h2 class="sr-only" id="suratJudul">Tulis balasanmu</h2>

    <p class="kertas-untuk">Tulis balasanmu</p>

    <input class="kertas-nama" id="suratNama" type="text"
           placeholder="Dari (boleh dikosongkan)"
           maxlength="60" autocomplete="off">

    <textarea class="kertas-isi" id="suratCatatan"
              placeholder="Tulis catatanmu di sini…"
              maxlength="1500"></textarea>

    <div class="kertas-gambar" id="suratPratinjau" hidden>
      <img alt="Pratinjau gambar yang akan dikirim">
      <button type="button" id="suratHapusFoto"
              aria-label="Hapus gambar">&times;</button>
    </div>

    <div class="kertas-aksi">

      <label class="tombol-lampir" for="suratBerkas">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round"
             stroke-linejoin="round" aria-hidden="true">
          <path d="M21 11.5l-8.6 8.6a5.5 5.5 0 0 1-7.8-7.8l8.6-8.6a3.7 3.7 0 0 1 5.2 5.2l-8.6 8.6a1.8 1.8 0 0 1-2.6-2.6l7.9-7.9"/>
        </svg>
        Lampirkan gambar
      </label>

      <input type="file" id="suratBerkas" accept="image/*" hidden>

      <button class="tombol-kirim" id="suratKirim" type="button">Kirim</button>

    </div>

    <p class="kertas-status" id="suratStatus" role="status" aria-live="polite"></p>

    <input type="checkbox" id="suratBot" tabindex="-1" autocomplete="off"
           style="display:none" aria-hidden="true">

  </div>
</div>
